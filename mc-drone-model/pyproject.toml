[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drone-model"
version = "0.1.0"
description = "Baseline navigate_to policy for mc-drone, behavior cloning from expert demos"
authors = [{ name = "Cat Pereira" }]
requires-python = ">=3.11"
# torch comes from the CUDA index, see the README
dependencies = ["numpy>=2.0", "mcdrone"]

[project.optional-dependencies]
dev = ["pytest>=8.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/drone_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
