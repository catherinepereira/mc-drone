plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	runs.configureEach {
		// recordings are training data, logs stay with the mod, both folders are gitignored
		property("mcdrone.data", file("../mc-drone-model/data").absolutePath)
		property("mcdrone.logs", file("run/logs").absolutePath)
		// keeps the client gametest world open this many seconds so an external script can drive the bridge
		property("mcdrone.e2eHoldSeconds", (project.findProperty("e2eHold") ?: "0").toString())
	}

	mods {
		"mcdrone" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mcdrone-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}
