[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcdrone"
version = "0.1.0"
description = "Client, Gymnasium env, and dataset loader for the mc-drone Minecraft mod"
authors = [{ name = "Cat Pereira" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "websockets>=15.0",
  "gymnasium>=1.2",
  "pillow>=11.0",
  "nbtlib>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcdrone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
