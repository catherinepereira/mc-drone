# BlueMap's web server for the client gametest, copied into its run folder before each launch (see build.gradle)
enabled: true
webroot: "bluemap/web"

# this machine only, the map shows where the drones and the player are
ip: "127.0.0.1"
port: 8100

additional-headers: {
  "Cache-Control": "public, max-age=86400, stale-if-error=604800"
  "CDN-Cache-Control": "max-age=60"
}

log: {
  file: "bluemap/logs/webserver.log"
  append: false
  format: "%1$s \"%3$s %4$s %5$s\" %6$s %7$s"
}
