# BlueMap settings for the client gametest, copied into its run folder before each launch (see build.gradle)
# accept-download true accepts Mojang's EULA (https://account.mojang.com/documents/minecraft_eula) and lets BlueMap
# download the Minecraft client jar it renders the map with
accept-download: true

# where BlueMap keeps its render progress and other runtime files
data: "bluemap"

# one thread keeps rendering light next to training runs
render-thread-count: 1
