plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	runs.configureEach {
		// recordings are training data, logs stay with the mod, both folders are gitignored
		property("mcdrone.data", file("../training/data").absolutePath)
		property("mcdrone.logs", file("run/logs").absolutePath)
		// keeps the client gametest world open this many seconds so an external script can drive the bridge
		property("mcdrone.e2eHoldSeconds", (project.findProperty("e2eHold") ?: "0").toString())
	}

	mods {
		"mcdrone" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mcdrone-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

repositories {
	maven {
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		url = "https://repo.bluecolored.de/releases"
		content {
			includeGroup "de.bluecolored"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// optional web map, the mod draws its regions and drones on it when it's installed
	compileOnly "de.bluecolored:bluemap-api:${project.bluemap_api_version}"
	localRuntime "maven.modrinth:bluemap:${project.bluemap_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}
